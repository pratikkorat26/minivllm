[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma3-from-scratch-python"
version = "0.1.0"
description = "Readable Gemma 3 270M inference implementation with a local OpenAI-like API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "huggingface_hub",
    "pydantic>=2",
    "safetensors",
    "starlette",
    "tokenizers",
    "torch>=2.5",
    "uvicorn",
]

[project.optional-dependencies]
benchmark = ["matplotlib"]
reference = ["transformers>=4.52"]
dev = ["pytest", "ruff"]

[project.scripts]
gemma3-generate = "main:main"
gemma3-serve = "adapters.openai.run:main"

[tool.setuptools]
py-modules = ["main", "query_fastapi"]

[tool.setuptools.packages.find]
include = [
    "adapters*",
    "app*",
    "config*",
    "gemma3*",
    "inference*",
    "runtime*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
